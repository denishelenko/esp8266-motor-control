<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Керування кареткою</title>
<style>
.calibrationBox{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#242c26}.calibrationTitle{font-size:.78rem;color:var(--muted);font-weight:750;margin-bottom:8px}.calibrationDirections,.calibrationDurations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.calibrationDurations{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px}.calibrationBox button{min-height:40px}.calibrationBox button.selected{background:var(--mid);border-color:var(--paper)}.calibrationHint{margin:8px 0 0;color:var(--muted);font-size:.7rem;line-height:1.35}
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ink:#1A1F1B;--panel:#2F3A33;--mid:#5E6A61;--accent:#9FA38B;--paper:#E7E6DD;--line:#5E6A61;--muted:#bfc1ac}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--ink);color:var(--paper);min-height:100svh;padding:16px;display:grid;place-items:center}main{width:min(960px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 22px 60px #0008}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.25rem;margin:0}.status{font-size:.78rem;color:var(--muted);display:flex;gap:7px;align-items:center}.statusDot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.carriages{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 12px;width:100%}.carriage{border:2px solid var(--accent);width:100%;border-radius:17px;background:#39433c;min-height:117px;padding:10px;color:var(--paper);position:relative;text-align:left}.carriage .state{position:absolute;right:10px;top:11px;font-size:.67rem;color:var(--muted);display:flex;align-items:center;gap:5px}.signal{display:flex;align-items:flex-end;gap:2px;height:14px}.signal b{display:block;width:3px;background:var(--mid);border-radius:1px}.signal b:nth-child(1){height:5px}.signal b:nth-child(2){height:8px}.signal b:nth-child(3){height:11px}.signal b:nth-child(4){height:14px}.state.level-2 .signal b:nth-child(-n+2){background:#e1a14e}.state.level-2 .signal b:nth-child(-n+2),.state.level-3 .signal b:nth-child(-n+3),.state.level-4 .signal b{opacity:1}.state.level-4 .signal b{background:#fff}.cart{display:block;width:min(210px,100%);height:92px;margin:5px auto 0}.cart .cable{stroke:#aeb5aa;stroke-width:3;stroke-linecap:round}.cart .carriage-stem{fill:#090b0a;stroke:#667168;stroke-width:2}.cart .carriage-bar{fill:#0b0d0c;stroke:#828d84;stroke-width:2.4}.cart .carriage-panel{fill:#252b27;stroke:#7e897f;stroke-width:1.6}.cart .wheel-shell{fill:#c7ccc2;stroke:#252d28;stroke-width:3}.cart .wheel-face{fill:#414a43}.cart .wheel-hub{fill:#dce0d6}.cart .led-halo{fill:#f04a3b;opacity:0}.cart .led-core{fill:#6d2824}.carriage.moving .cart .led-core{animation:cartLed .65s steps(1,end) infinite}.carriage.moving .cart .led-halo{animation:cartHalo .65s steps(1,end) infinite}@keyframes cartLed{0%,49%{fill:#ff4d3d}50%,100%{fill:#6d2824}}@keyframes cartHalo{0%,49%{opacity:.5}50%,100%{opacity:0}}
.readout{text-align:center;margin:8px 0}.readout strong{font-size:1rem}.readout span{font-size:.8rem;color:var(--muted)}.railWrap{position:relative;padding:44px 0 38px}.rail{height:14px;border-radius:20px;background:#5E6A61;box-shadow:inset 0 2px 5px #0009}.centre{position:absolute;left:50%;top:38px;width:2px;height:28px;background:var(--paper);transform:translateX(-50%)}.ipsc{position:absolute;top:51px;width:82.368px;height:108.576px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px #000);pointer-events:none;z-index:2}.ipsc .target-outline{fill:#FF4D00;stroke:#000;stroke-width:5}.ipsc .target-rim,.ipsc .target-zone{fill:none;stroke:#000;stroke-width:3}.ipsc .target-zone{stroke-width:4}.ipsc text{fill:#000;font:700 28px system-ui;text-anchor:middle}.targetDot{position:absolute;top:46px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);box-shadow:0 0 8px #9FA38B99;pointer-events:none;z-index:1}.targetInput{position:absolute;left:0;top:16px;width:100%;height:70px;margin:0;opacity:.01;cursor:pointer;touch-action:pan-x;z-index:3}.ticks{position:relative;height:45px;margin-top:5px;color:var(--muted);font-size:.7rem}.tick{position:absolute;top:0;width:1px;height:8px;transform:translateX(-50%);background:var(--mid);font-style:normal}.tick.major{width:2px;height:15px;background:var(--accent)}.tick span{position:absolute;top:31px;left:50%;transform:translateX(-50%);white-space:nowrap}.tick:first-child span{left:0;transform:none}.tick:last-child span{left:0;transform:translateX(-100%)}.speed{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:10px;margin:10px 0 16px;color:var(--muted)}input[type=range]{accent-color:var(--accent)}output{color:var(--paper);font-weight:800;text-align:right}.stop{width:100%;min-height:55px;border:1px solid var(--accent);border-radius:15px;background:#5E6A61;color:var(--paper);font-weight:900;font-size:1rem;cursor:pointer}.stop.running{background:#75433f}.automation{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.programs{display:grid;grid-template-columns:1fr;gap:8px}.programs button,.manual button,.servoButtons button{background:var(--ink);border:1px solid var(--mid);color:var(--paper);border-radius:12px;min-height:49px;font-weight:750;cursor:pointer}.programs button.active{background:var(--mid);border-color:var(--accent)}.programs small{display:block;color:var(--accent);font-weight:500;margin-top:3px}.sectionTitle{font-size:.8rem;color:var(--muted);margin:15px 0 7px;font-weight:700}.servoPanel{border:1px solid var(--line);border-radius:14px;padding:9px;min-height:100%;display:flex;flex-direction:column}.servoTitle{text-align:center;color:var(--muted);font-size:.76rem;font-weight:750;margin:1px 0 9px}.servoButtons{display:flex;flex:1;flex-direction:column;gap:8px}.servoButtons button{width:100%;flex:1;display:flex;align-items:center;justify-content:center}.servoButtons button.active{background:var(--mid);border-color:var(--paper)}.servoButtons button.selected{border-color:var(--paper)}.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}details{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}summary{cursor:pointer;color:var(--muted)}.manual{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin-top:10px}.manual .zero{font-size:.72rem;line-height:1.2;padding:5px}button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}@media(max-width:520px){body{padding:0;display:block}main{min-height:100svh;border:0;border-radius:0;padding:max(19px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));box-shadow:none}.cart{transform:scale(.88);margin:-1px auto -3px}.programs button,.servoButtons button{min-height:50px}.manual button{min-height:55px}}@media(min-width:700px){main{padding:24px 28px}.carriage{min-height:135px}.cart{height:105px}}
</style>
</head>
<body>
<main>
<header><h1>Каретка</h1><div class="status"><i class="statusDot"></i><span>Сайт онлайн</span></div></header>
<section class="carriages" aria-label="Каретка"><button class="carriage active" id="carriage"><span class="state level-2"><i class="signal"><b></b><b></b><b></b><b></b></i><span>онлайн</span></span><svg class="cart" viewBox="0 0 210 100" aria-label="каретка з тросом знизу"><path class="cable" d="M4 78H206"/><path class="carriage-stem" d="M79 46H131L124 77Q123 86 113 86H97Q87 86 86 77Z"/><path class="carriage-bar" d="M30 23H180Q190 23 190 33V47Q190 55 180 55H30Q20 55 20 47V33Q20 23 30 23Z"/><path class="carriage-panel" d="M54 31H156L151 47H59Z"/><circle class="wheel-shell" cx="30" cy="39" r="14"/><circle class="wheel-face" cx="30" cy="39" r="7"/><circle class="wheel-hub" cx="30" cy="39" r="2"/><circle class="wheel-shell" cx="180" cy="39" r="14"/><circle class="wheel-face" cx="180" cy="39" r="7"/><circle class="wheel-hub" cx="180" cy="39" r="2"/><circle class="led-halo" cx="105" cy="39" r="12"/><circle class="led-core" cx="105" cy="39" r="5"/></svg></button></section>
<div class="readout"><strong id="pos">0.00</strong><strong> м</strong> <span>від центру</span></div>
<div class="railWrap"><div class="rail"></div><div class="centre"></div><svg id="ipsc" class="ipsc" viewBox="0 0 400 520" style="left:50%" aria-label="IPSC мішень"><path class="target-outline" d="M154 90H246L335 204V292L246 430H154L65 292V204Z"/><path class="target-rim" d="M156 94H244L331 206V290L244 426H156L69 290V206Z"/><path class="target-zone" d="M154 94H246L292 204V289L226 361H174L108 289V204Z"/><path class="target-zone" d="M186 106H214L244 204V257L214 304H186L156 257V204Z"/><text x="200" y="218">A</text><text x="138" y="218">C</text><text x="262" y="218">C</text><text x="92" y="218">D</text><text x="308" y="218">D</text></svg><i id="targetDot" class="targetDot" style="left:50%" aria-label="вибрана точка"></i><input id="target" class="targetInput" type="range" min="-8" max="8" step="0.05" value="0"><div class="ticks"><i class="tick major" style="left:0%"><span>−8 м</span></i><i class="tick" style="left:6.25%"></i><i class="tick major" style="left:12.5%"><span>−6</span></i><i class="tick" style="left:18.75%"></i><i class="tick major" style="left:25%"><span>−4</span></i><i class="tick" style="left:31.25%"></i><i class="tick major" style="left:37.5%"><span>−2</span></i><i class="tick" style="left:43.75%"></i><i class="tick major" style="left:50%"><span>центр</span></i><i class="tick" style="left:56.25%"></i><i class="tick major" style="left:62.5%"><span>+2</span></i><i class="tick" style="left:68.75%"></i><i class="tick major" style="left:75%"><span>+4</span></i><i class="tick" style="left:81.25%"></i><i class="tick major" style="left:87.5%"><span>+6</span></i><i class="tick" style="left:93.75%"></i><i class="tick major" style="left:100%"><span>+8 м</span></i></div></div>
<div class="speed"><label for="speed">Швидкість</label><input id="speed" type="range" min="1" max="100" value="50"><output id="speedOut">50%</output></div><button id="stop" class="stop">СТАРТ</button>
<p class="sectionTitle">Режими роботи</p><div class="automation"><div class="programs"><button data-program="1" class="active">Маятник<small>від краю до краю</small></button><button data-program="2">Драбинка<small>зупинка кожні 2 м</small></button><button data-program="3">Ривки<small>швидкі 1–3 м на 100%</small></button><button data-program="4">Рандом<small>довгі переходи від 4 м</small></button></div><section class="servoPanel"><div class="servoTitle">Керування сервоприводом</div><div class="servoButtons"><button data-servo="45" class="selected">45°</button><button data-servo="90">90°</button><button id="servoOff" class="active">Вимк.</button></div><div id="servoState" class="srOnly" aria-live="polite">вимкнено · 0°</div></section></div>
<details><summary>Ручне калібрування</summary><div class="manual"><button id="left">Вліво</button><button id="zero" class="zero">Позначити поточне місце як центр</button><button id="right">Вправо</button></div><div class="calibrationBox"><div class="calibrationTitle">Тест відстані за часом</div><div class="calibrationDirections"><button type="button" data-cal-dir="left">← Вліво</button><button type="button" data-cal-dir="right" class="selected">Вправо →</button></div><div class="calibrationDurations"><button type="button" data-cal-seconds="1">1 с</button><button type="button" data-cal-seconds="2">2 с</button><button type="button" data-cal-seconds="3">3 с</button><button type="button" data-cal-seconds="4">4 с</button></div><p class="calibrationHint">Встановіть каретку в центр, виберіть напрямок і час. Після зупинки виміряйте рулеткою реальну відстань.</p></div></details>
</main>
<script>
const $=id=>document.getElementById(id),all=q=>[...document.querySelectorAll(q)];let drag=false,last=performance.now(),jog=0;
const x={p:0,t:0,s:50,prog:1,mode:"stop",angle:45,servo:0,visualServo:0,servoEnabled:false,nextServo:0,step:0,calUntil:0,calDir:"right"};let calibrationDirection="right";
const pct=v=>((v+8)/16*100)+"%";function close(){x.servo=0;x.nextServo=0;x.servoEnabled=false}function stop(keepServo=false){x.t=x.p;x.mode="stop";x.calUntil=0;if(!keepServo)close()}function nextTarget(){let n=x.step++;if(x.prog===1)x.t=n%2?-8:8;else if(x.prog===2)x.t=[-2,2,-4,4,-6,6,-8,8][n%8];else if(x.prog===3){const d=1+Math.floor(Math.random()*3),dir=Math.random()<.5?-1:1;let target=x.p+dir*d;if(target>8||target<-8)target=x.p-dir*d;x.t=Math.max(-8,Math.min(8,target))}else{const d=4+Math.random()*3,dir=Math.random()<.5?-1:1;let target=x.p+dir*d;if(target>8||target<-8)target=x.p-dir*d;x.t=Math.max(-8,Math.min(8,target))}}function start(){x.mode="program";x.step=0;if(!x.servoEnabled){x.servo=0;x.servoEnabled=true;x.nextServo=performance.now()+2000}nextTarget()}
function redraw(){ $("pos").textContent=x.p.toFixed(2);$("ipsc").style.left=pct(x.p);$("targetDot").style.left=pct(x.t);if(!drag)$("target").value=x.t;$("speed").value=x.s;$("speedOut").textContent=(x.prog===3&&x.mode==="program"?100:x.s)+"%";$("stop").textContent=x.mode==="stop"?"СТАРТ":"СТОП";$("stop").classList.toggle("running",x.mode!=="stop");let phase=x.visualServo<x.servo-1?"відкривається":x.visualServo>x.servo+1?"закривається":x.servo?"відкрито":"закрито";$("servoState").textContent=x.servoEnabled?phase+" · "+Math.round(x.visualServo)+"°":"вимкнено · 0°";$("carriage").classList.toggle("moving",x.mode!=="stop"&&(x.mode==="calibration"||Math.abs(x.t-x.p)>.015));all("[data-program]").forEach(b=>b.classList.toggle("active",+b.dataset.program===x.prog));all("[data-servo]").forEach(b=>{b.classList.toggle("selected",+b.dataset.servo===x.angle);b.classList.toggle("active",+b.dataset.servo===x.angle&&x.servoEnabled)});$("servoOff").classList.toggle("active",!x.servoEnabled)}
function tick(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(x.servoEnabled&&x.nextServo&&n>=x.nextServo){x.servo=x.servo?0:x.angle;x.nextServo=n+(x.servo?1000:2000)}if(x.mode==="program"&&Math.abs(x.t-x.p)<.03)nextTarget();let sd=x.servo-x.visualServo,servoStep=90*dt/.35;x.visualServo+=Math.sign(sd)*Math.min(Math.abs(sd),servoStep);if(x.mode==="calibration"){if(n>=x.calUntil)stop(true);else{x.p+= (x.calDir==="right"?1:-1)*.8*x.s/100*dt;x.p=Math.max(-8,Math.min(8,x.p));x.t=x.p}}else if(x.mode!=="stop"){let d=x.t-x.p;if(Math.abs(d)>.01){const speed=x.prog===3?100:x.s;x.p+=Math.sign(d)*Math.min(Math.abs(d),.8*speed/100*dt)}}redraw();requestAnimationFrame(tick)}
function moveTarget(v){x.t=+v;x.mode="target";close();redraw()}$("speed").oninput=()=>{x.s=+$('speed').value;redraw()};$("target").onpointerdown=()=>drag=true;$("target").oninput=()=>moveTarget($("target").value);$("target").onchange=()=>drag=false;$("stop").onclick=()=>{if(x.mode!=="stop")stop(true);else start();redraw()};all("[data-program]").forEach(b=>b.onclick=()=>{x.prog=+b.dataset.program;start();redraw()});all("[data-servo]").forEach(b=>b.onclick=()=>{x.angle=+b.dataset.servo;if(!x.servoEnabled){x.servoEnabled=true;x.servo=0;x.nextServo=performance.now()+2000}else if(x.servo)x.servo=x.angle;redraw()});$("servoOff").onclick=()=>{close();redraw()};all("[data-cal-dir]").forEach(b=>b.onclick=()=>{calibrationDirection=b.dataset.calDir;all("[data-cal-dir]").forEach(x=>x.classList.toggle("selected",x.dataset.calDir===calibrationDirection))});all("[data-cal-seconds]").forEach(b=>b.onclick=()=>{x.mode="calibration";x.calDir=calibrationDirection;x.calUntil=performance.now()+Number(b.dataset.calSeconds)*1000;close();redraw()});function hold(dir){clearInterval(jog);x.mode="jog";x.t=dir*8;close();jog=setInterval(()=>x.t=dir*8,120)}function release(){clearInterval(jog);stop();redraw()}$("left").onpointerdown=()=>hold(-1);$("right").onpointerdown=()=>hold(1);for(const id of ["left","right"]){$(id).onpointerup=release;$(id).onpointercancel=release}$("zero").onclick=()=>{stop();x.p=x.t=0;redraw()};redraw();requestAnimationFrame(tick);
</script>
</body>
</html>
