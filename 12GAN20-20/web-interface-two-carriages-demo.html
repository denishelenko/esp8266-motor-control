<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Керування каретками</title>
<style>
:root{color-scheme:dark;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--ink:#1A1F1B;
--panel:#2F3A33;
--mid:#5E6A61;
--accent:#9FA38B;
--paper:#E7E6DD;
--line:#5E6A61;
--muted:#bfc1ac}
*{box-sizing:border-box;
-webkit-tap-highlight-color:transparent}
body{margin:0;
background:var(--ink);
color:var(--paper);
min-height:100svh;
padding:16px;
display:grid;
place-items:center}
main{width:min(960px,100%);
background:var(--panel);
border:1px solid var(--line);
border-radius:24px;
padding:20px;
box-shadow:0 22px 60px #0008}
header{display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:12px}
h1{font-size:1.25rem;
margin:0}
.status{font-size:.78rem;
color:var(--muted);
display:flex;
gap:7px;
align-items:center;
justify-self:end}
.dot{width:9px;
height:9px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 8px var(--accent)}
.carriages{display:grid;
grid-auto-flow:column;
grid-auto-columns:160px;
gap:10px;
margin:18px 0 12px;
overflow-x:auto;
overscroll-behavior-inline:contain;
scroll-snap-type:x proximity;
scrollbar-width:none;
-ms-overflow-style:none;
-webkit-overflow-scrolling:touch;
touch-action:pan-x;
width:100%;
min-width:0;
cursor:grab}
.carriages.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.carriages::-webkit-scrollbar{display:none}
.carriage{border:1px solid var(--mid);
width:100%;
min-width:0;
border-radius:17px;
background:var(--ink);
min-height:117px;
padding:10px;
cursor:pointer;
color:var(--paper);
position:relative;
text-align:left;
scroll-snap-align:start}
.carriage.active{border:2px solid var(--accent);
background:#39433c}
.carriage.inactive{opacity:.55;filter:saturate(.35);cursor:not-allowed}
.carriage .state{position:absolute;
right:10px;
top:11px;
font-size:.67rem;
color:var(--muted);
display:flex;
align-items:center;
gap:5px}
.signal{display:flex;
align-items:flex-end;
gap:2px;
height:14px}
.signal b{display:block;
width:3px;
background:var(--mid);
border-radius:1px;
opacity:.3}
.signal b:nth-child(1){height:5px}.signal b:nth-child(2){height:8px}.signal b:nth-child(3){height:11px}.signal b:nth-child(4){height:14px}
.state.level-1 .signal b:nth-child(1){background:#e15f57;opacity:1}
.state.level-2 .signal b:nth-child(-n+2){background:#e1a14e;opacity:1}
.state.level-3 .signal b:nth-child(-n+3),.state.level-4 .signal b{background:#fff;opacity:1}
.state.off .signal b{background:#B75E50;opacity:.25}


.cart{display:block;width:min(158px,100%);height:76px;margin:5px auto 0}.cart .cable{stroke:#aeb5aa;stroke-width:3;stroke-linecap:round}.cart .carriage-stem{fill:#090b0a;stroke:#667168;stroke-width:2}.cart .carriage-bar{fill:#0b0d0c;stroke:#828d84;stroke-width:2.4}.cart .carriage-panel{fill:#252b27;stroke:#7e897f;stroke-width:1.6}.cart .wheel-shell{fill:#c7ccc2;stroke:#252d28;stroke-width:3}.cart .wheel-face{fill:#414a43}.cart .wheel-hub{fill:#dce0d6}.cart .led-halo{fill:#f04a3b;opacity:0}.cart .led-core{fill:#6d2824}.carriage.moving .cart .led-core{animation:cartLed .65s steps(1,end) infinite}.carriage.moving .cart .led-halo{animation:cartHalo .65s steps(1,end) infinite}@keyframes cartLed{0%,49%{fill:#ff4d3d}50%,100%{fill:#6d2824}}@keyframes cartHalo{0%,49%{opacity:.5}50%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.carriage.moving .cart .led-core,.carriage.moving .cart .led-halo{animation:none}.carriage.moving .cart .led-core{fill:#ff4d3d}.carriage.moving .cart .led-halo{opacity:.25}}
.chain{width:62.4px;
height:27.3px;
display:grid;
place-items:center;
padding:0;
border:1px solid var(--mid);
background:var(--mid);
color:#fff;
border-radius:999px;
cursor:pointer}
.chain svg{display:block;
width:54px;
height:16.8px;
fill:currentColor}
.chain .linkedIcon{display:none}
.chain.active .linkedIcon{display:inline}
.chain.active .brokenIcon{display:none}
.chain.active{color:#fff;
border-color:var(--ink);
background:var(--ink);
box-shadow:0 0 11px #9FA38B44}
.chain.offline{position:relative;
border-color:#B75E50;
background:#383c38;
box-shadow:none}
.chain.offline .linkedIcon{display:none}
.chain.offline .brokenIcon{display:inline}
.chain.offline::before,.chain.offline::after{content:"";
position:absolute;
left:50%;
top:50%;
width:21px;
height:2px;
border-radius:2px;
background:#e15f57;
transform:translate(-50%,-50%) rotate(45deg)}
.chain.offline::after{transform:translate(-50%,-50%) rotate(-45deg)}
.readout{text-align:center;
margin:8px 0}
.readout strong{font-size:1rem;
letter-spacing:normal}
.readout span{font-size:.8rem;
color:var(--muted)}
.railWrap{position:relative;
padding:44px 0 38px}
.rail{height:14px;
border-radius:20px;
background:#5E6A61;
box-shadow:inset 0 2px 5px #0009}
.centre{position:absolute;
left:50%;
top:38px;
width:2px;
height:28px;
background:var(--paper);
transform:translateX(-50%)}
.ipsc{position:absolute;
top:51px;
width:82.368px;
height:108.576px;
transform:translate(-50%,-50%);
filter:drop-shadow(0 2px 4px #000);
pointer-events:none}
.ipsc .target-outline{fill:#FF4D00;stroke:#000;stroke-width:5}.ipsc .target-rim{fill:none;stroke:#000;stroke-width:3}.ipsc .target-zone{fill:none;stroke:#000;stroke-width:4}.ipsc text{fill:#000;font:700 28px system-ui;text-anchor:middle}
.targetDot{position:absolute;
top:46px;
width:10px;
height:10px;
margin-left:-5px;
border-radius:50%;
background:var(--accent);
border:2px solid var(--paper);
box-shadow:0 0 8px #9FA38B99;
pointer-events:none;
z-index:1}
.ipsc{z-index:2}
input[type=range].target{z-index:3}
input[type=range].target{position:absolute;
left:0;
top:16px;
width:100%;
height:70px;
margin:0;
opacity:.01;
cursor:pointer;
touch-action:pan-x}
.ticks{position:relative;
height:45px;
margin-top:5px;
color:var(--muted);
font-size:.7rem}
.tick{position:absolute;
top:0;
width:1px;
height:8px;
transform:translateX(-50%);
background:var(--mid);
font-style:normal}
.tick.major{width:2px;
height:15px;
background:var(--accent)}
.tick span{position:absolute;
top:31px;
left:50%;
transform:translateX(-50%);
white-space:nowrap}
.tick:first-child span{left:0;
transform:none}
.tick:last-child span{left:0;
transform:translateX(-100%)}
.speed{display:grid;
grid-template-columns:auto 1fr 48px;
align-items:center;
gap:10px;
margin:10px 0 16px;
color:var(--muted)}
input[type=range]{accent-color:var(--accent)}
output{color:var(--paper);
font-weight:800;
text-align:right}
.stop{width:100%;
min-height:55px;
border:1px solid var(--accent);
border-radius:15px;
background:#5E6A61;
color:var(--paper);
font-weight:900;
font-size:1rem;
cursor:pointer}
.automation{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
.programs{display:grid;grid-template-columns:1fr;gap:8px}
.programs button,.manual button,.servoButtons button{background:var(--ink);
border:1px solid var(--mid);
color:var(--paper);
border-radius:12px;
min-height:49px;
font-weight:750;
cursor:pointer}
.programs button.active{background:var(--mid);
border-color:var(--accent)}
.programs small{display:block;color:var(--accent);font-weight:500;margin-top:3px}
.sectionTitle{font-size:.8rem;color:var(--muted);margin:15px 0 7px;font-weight:700}
.servoPanel{border:1px solid var(--line);border-radius:14px;padding:9px;min-height:100%;display:flex;flex-direction:column}
.servoTitle{text-align:center;color:var(--muted);font-size:.76rem;font-weight:750;margin:1px 0 9px}
.servoButtons{display:flex;flex:1;flex-direction:column;gap:8px}
.servoButtons button{width:100%;flex:1;display:flex;align-items:center;justify-content:center}
.servoButtons button.active{background:var(--mid);border-color:var(--paper)}
.servoButtons button.selected{border-color:var(--paper)}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
details{margin-top:14px;
border-top:1px solid var(--line);
padding-top:11px}
summary{cursor:pointer;
color:var(--muted)}
.manual{display:grid;
grid-template-columns:1fr 1.5fr 1fr;
gap:8px;
margin-top:10px}
.manual .zero{font-size:.72rem;line-height:1.2;padding:5px}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media(max-width:520px){body{padding:0;
display:block}
main{min-height:100svh;
border:0;
border-radius:0;
padding:max(19px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
box-shadow:none}
.carriages{margin-top:15px}
.cart{transform:scale(.88);
margin:-1px auto -3px}
.programs button,.servoButtons button{min-height:50px}
.manual button{min-height:55px}
}

</style>
</head>
<body>
<main>
<header>

<button id="link" class="chain" aria-pressed="false" title="Окремі команди для кожної каретки"><svg viewBox="0 0 100 34" aria-hidden="true"><g class="linkedIcon" fill="none" stroke="currentColor" stroke-width="6"><path d="M16 4H28a13 13 0 0 1 0 26H16a13 13 0 0 1 0-26Z"/><path d="M44 4H56a13 13 0 0 1 0 26H44a13 13 0 0 1 0-26Z"/><path d="M72 4H84a13 13 0 0 1 0 26H72a13 13 0 0 1 0-26Z"/></g><path class="brokenIcon" d="M44.0,10.7L44.0,16.7L55.8,16.7L55.6,10.4ZM58.1,9.8L58.1,17.6L59.8,21.2L62.8,24.5L66.2,26.4L82.4,31.8L86.8,32.1L91.8,30.9L94.5,29.2L96.6,27.0L99.0,22.5L99.0,14.5L97.3,10.9L94.3,7.6L91.3,5.9L75.3,0.6L68.7,0.2L65.3,1.3L70.2,3.0L73.7,6.5L88.5,11.2L91.6,13.2L93.3,16.2L93.6,20.0L91.9,23.4L89.0,25.7L84.1,26.1L67.9,20.7L65.7,19.2L63.9,16.6L63.8,11.5ZM54.9,0.2L53.0,5.8L66.5,10.3L67.0,12.2L65.6,13.7L65.9,15.6L67.9,18.3L69.1,18.4L70.2,17.8L71.9,15.9L73.0,13.3L73.0,10.3L71.0,6.4L67.5,4.2ZM45.0,0.2L32.2,4.2L29.0,6.2L27.0,9.5L26.9,13.3L29.2,17.5L31.4,18.4L33.2,17.0L34.2,13.8L32.7,12.2L33.5,10.2L46.8,5.8ZM41.7,9.8L36.1,11.5L35.9,16.6L34.2,19.2L31.9,20.7L15.6,26.1L10.8,25.7L7.5,22.9L6.2,20.0L6.2,17.1L8.1,13.2L11.3,11.2L26.1,6.5L29.2,3.3L34.4,1.3L31.0,0.2L24.5,0.6L8.5,5.9L5.5,7.6L2.7,10.7L1.0,13.9L0.4,16.5L0.4,20.6L1.0,23.2L2.7,26.4L5.3,29.2L10.4,31.8L17.3,31.8L35.8,25.3L39.4,22.1L41.3,18.7L42.2,15.6Z"/></svg></button>

</button>

<svg class="cart" viewBox="0 0 210 100" aria-label="каретка з тросом знизу"><path class="cable" d="M4 78H206"/><path class="carriage-stem" d="M79 46H131L124 77Q123 86 113 86H97Q87 86 86 77Z"/><path class="carriage-bar" d="M30 23H180Q190 23 190 33V47Q190 55 180 55H30Q20 55 20 47V33Q20 23 30 23Z"/><path class="carriage-panel" d="M54 31H156L151 47H59Z"/><circle class="wheel-shell" cx="30" cy="39" r="14"/><circle class="wheel-face" cx="30" cy="39" r="7"/><circle class="wheel-hub" cx="30" cy="39" r="2"/><circle class="wheel-shell" cx="180" cy="39" r="14"/><circle class="wheel-face" cx="180" cy="39" r="7"/><circle class="wheel-hub" cx="180" cy="39" r="2"/><circle class="led-halo" cx="105" cy="39" r="12"/><circle class="led-core" cx="105" cy="39" r="5"/></svg>
</button>
</section>
<div class="readout">
<strong id="pos">0.00</strong><strong> м</strong> <span>від центру · <b id="which">каретка 1</b>

<script>
const $=id=>document.getElementById(id),all=q=>[...document.querySelectorAll(q)];
let selected=0,linked=false,drag=false,last=performance.now(),jog=0;
const carriageScroller=document.querySelector(".carriages");
function fitCarriages(){const width=carriageScroller.clientWidth;if(!width)return;const gap=10,minCard=150,capacity=Math.max(2,Math.floor((width+gap)/(minCard+gap))),visible=Math.min(carriageScroller.children.length,capacity),cardWidth=Math.floor((width-gap*(visible-1))/visible);carriageScroller.style.gridAutoColumns=`${cardWidth}px`}
if("ResizeObserver" in window)new ResizeObserver(fitCarriages).observe(carriageScroller);else window.addEventListener("resize",fitCarriages,{passive:true});
new MutationObserver(fitCarriages).observe(carriageScroller,{childList:true});
fitCarriages();
const demoNodeOnline=!(typeof location!=="undefined"&&/node=offline/.test(location.search));
const c=Array.from({length:2},(_,i)=>({p:0,t:0,s:50,prog:1,mode:"stop",angle:45,servo:0,visualServo:0,servoEnabled:false,nextServo:0,step:0,level:i===0?2:4}));
if(!demoNodeOnline){$("link").classList.add("offline");$("link").title="Немає сигналу другої каретки";$("link").setAttribute("aria-label",$("link").title);$("status").textContent="Сайт онлайн";$("state2").className="state off level-0";$("state2").querySelector(".stateLabel").textContent="офлайн"}
const pct=v=>((v+8)/16*100)+"%";
function affected(fn){fn(c[selected]);if(linked)fn(c[selected?0:1])}
function close(x){x.servo=0;x.nextServo=0;x.servoEnabled=false}
function stop(x,keepServo=false){x.t=x.p;x.mode="stop";if(!keepServo)close(x)}
function nextTarget(x){let n=x.step++;if(x.prog===1)x.t=n%2?-8:8;else if(x.prog===2)x.t=[-2,2,-4,4,-6,6,-8,8][n%8];else if(x.prog===3){const d=1+Math.floor(Math.random()*3),dir=Math.random()<.5?-1:1;let target=x.p+dir*d;if(target>8||target<-8)target=x.p-dir*d;x.t=Math.max(-8,Math.min(8,target))}else{const d=4+Math.random()*3,dir=Math.random()<.5?-1:1;let target=x.p+dir*d;if(target>8||target<-8)target=x.p-dir*d;x.t=Math.max(-8,Math.min(8,target))}}
function start(x){x.mode="program";x.step=0;if(!x.servoEnabled){x.servo=0;x.servoEnabled=true;x.nextServo=performance.now()+2000}nextTarget(x)}
function redraw(){let x=c[selected];$("pos").textContent=x.p.toFixed(2);$("which").textContent="каретка "+(selected+1);$("ipsc").style.left=pct(x.p);$("targetDot").style.left=pct(x.t);if(!drag)$("target").value=x.t;$("speed").value=x.s;$("speedOut").textContent=x.s+"%";$("stop").textContent=x.mode==="stop"?"СТАРТ":"СТОП";let phase=x.visualServo<x.servo-1?"відкривається":x.visualServo>x.servo+1?"закривається":x.servo?"відкрито":"закрито";$("servoState").textContent=x.servoEnabled?phase+" · "+Math.round(x.visualServo)+"°":"вимкнено · 0°";all(".carriage").forEach(b=>{const carriage=c[+b.dataset.carriage-1];b.classList.toggle("active",+b.dataset.carriage===selected+1);b.classList.toggle("moving",(+b.dataset.carriage!==2||demoNodeOnline)&&carriage.mode!=="stop"&&Math.abs(carriage.t-carriage.p)>.015)});all("[data-program]").forEach(b=>b.classList.toggle("active",+b.dataset.program===x.prog));all("[data-servo]").forEach(b=>{b.classList.toggle("selected",+b.dataset.servo===x.angle);b.classList.toggle("active",+b.dataset.servo===x.angle&&x.servoEnabled)});$("servoOff").classList.toggle("active",!x.servoEnabled)}
function tick(n){let dt=Math.min(.05,(n-last)/1000);last=n;if(!demoNodeOnline){stop(c[1]);if(linked)stop(c[0])}c.forEach(x=>{if(x.servoEnabled&&x.nextServo&&n>=x.nextServo){x.servo=x.servo?0:x.angle;x.nextServo=n+(x.servo?1000:2000)}if(x.mode==="program"&&Math.abs(x.t-x.p)<.03)nextTarget(x);let sd=x.servo-x.visualServo,servoStep=90*dt/.35;x.visualServo+=Math.sign(sd)*Math.min(Math.abs(sd),servoStep);if(x.mode!=="stop"){let d=x.t-x.p;if(Math.abs(d)>.01){const speed=x.prog===3?100:x.s;x.p+=Math.sign(d)*Math.min(Math.abs(d),.8*speed/100*dt)}else if(x.mode==="target")x.mode="stop"}});redraw();requestAnimationFrame(tick)}
all(".carriage").forEach(b=>b.onclick=()=>{selected=+b.dataset.carriage-1;redraw()});
let mouseDownX=0,mouseScrollLeft=0,mouseDragging=false,suppressCarriageClick=false;
carriageScroller.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;mouseDragging=true;suppressCarriageClick=false;mouseDownX=e.clientX;mouseScrollLeft=carriageScroller.scrollLeft});
carriageScroller.addEventListener("pointermove",e=>{if(!mouseDragging)return;const delta=e.clientX-mouseDownX;if(Math.abs(delta)>4){suppressCarriageClick=true;carriageScroller.classList.add("dragging");carriageScroller.scrollLeft=mouseScrollLeft-delta}});
const endMouseDrag=()=>{mouseDragging=false;carriageScroller.classList.remove("dragging")};
carriageScroller.addEventListener("pointerup",endMouseDrag);carriageScroller.addEventListener("pointercancel",endMouseDrag);
carriageScroller.addEventListener("click",e=>{if(suppressCarriageClick){e.preventDefault();e.stopImmediatePropagation();suppressCarriageClick=false}},true);
carriageScroller.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){carriageScroller.scrollBy({left:(e.key==="ArrowRight"?1:-1)*carriageScroller.clientWidth*.75,behavior:"smooth"});e.preventDefault()}});
carriageScroller.addEventListener("wheel",e=>{if(carriageScroller.scrollWidth<=carriageScroller.clientWidth)return;const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;carriageScroller.scrollLeft+=delta;e.preventDefault()},{passive:false});
$("link").onclick=()=>{linked=!linked;$("link").classList.toggle("active",linked);$("link").setAttribute("aria-pressed",linked);$("link").title=linked?"Синхронні команди для обох кареток":"Окремі команди для кожної каретки"};
$("speed").oninput=()=>{affected(x=>x.s=+$("speed").value);redraw()};
$("target").onpointerdown=()=>drag=true;
$("target").oninput=()=>{affected(x=>{x.t=+$("target").value;x.mode="target";close(x)});redraw()};
$("target").onchange=()=>drag=false;
$("stop").onclick=()=>{const running=c[selected].mode!=="stop",program=c[selected].prog,speed=c[selected].s;affected(x=>{if(running)stop(x,true);else{x.prog=program;x.s=speed;start(x)}});redraw()};
all("[data-program]").forEach(b=>b.onclick=()=>{affected(x=>{x.prog=+b.dataset.program;start(x)});redraw()});
all("[data-servo]").forEach(b=>b.onclick=()=>{affected(x=>{x.angle=+b.dataset.servo;if(!x.servoEnabled){x.servoEnabled=true;x.servo=0;x.nextServo=performance.now()+2000}else if(x.servo)x.servo=x.angle});redraw()});
$("servoOff").onclick=()=>{affected(close);redraw()};
function hold(dir){clearInterval(jog);affected(x=>{x.mode="jog";x.t=dir*8;close(x)});jog=setInterval(()=>affected(x=>x.t=dir*8),120)}
function release(){clearInterval(jog);affected(stop);redraw()}
$("left").onpointerdown=()=>hold(-1);$("right").onpointerdown=()=>hold(1);
for(const id of ["left","right"]){$(id).onpointerup=release;$(id).onpointercancel=release}
$("zero").onclick=()=>{affected(x=>{stop(x);x.p=x.t=0});redraw()};
redraw();requestAnimationFrame(tick);
</script>
</body>
</html>
