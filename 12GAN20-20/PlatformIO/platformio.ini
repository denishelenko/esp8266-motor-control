[platformio]
default_envs = single_esp32s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep

[web]
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    links2004/WebSockets @ 2.3.6

[esp8266]
platform = espressif8266 @ 4.2.1

[esp32s3]
; This release provides Arduino-ESP32 3.3.3 and the matching ESP-IDF.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = carriage-esp32s3-n16r8
upload_protocol = esptool
upload_speed = 921600

[env:single_nodemcu]
extends = esp8266, web
board = nodemcuv2
build_src_filter = +<single_nodemcu.cpp>

[env:single_d1_mini_pro]
extends = esp8266, web
board = d1_mini_pro
build_src_filter = +<single_d1_mini_pro.cpp>

[env:single_esp32s3]
extends = esp32s3, web
build_src_filter = +<single_esp32s3.cpp>

[env:dual_esp32s3_controller]
extends = esp32s3, web
build_src_filter = +<dual_esp32s3_controller.cpp>

[env:dual_esp32s3_remote]
extends = esp32s3
build_src_filter = +<dual_esp32s3_remote.cpp>

; External Motor-Control AP, two ESP32-S3 carriages, ESP-NOW + OTA.
; Flash the *_home_serial profiles over USB once, then use *_home_ota.
[env:dual_home_main_serial]
extends = esp32s3, web
build_src_filter = +<dual_home_main.cpp>

[env:dual_home_remote_serial]
extends = esp32s3
build_src_filter = +<dual_home_remote.cpp>

[env:dual_home_main_ota]
extends = esp32s3, web
build_src_filter = +<dual_home_main.cpp>
upload_protocol = espota
upload_port = motor.local
upload_flags =
    --port=3232
    --auth=motor8266

[env:dual_home_remote_ota]
extends = esp32s3
build_src_filter = +<dual_home_remote.cpp>
upload_protocol = espota
upload_port = motor-carriage-2.local
upload_flags =
    --port=3232
    --auth=motor8266
