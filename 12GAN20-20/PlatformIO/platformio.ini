[platformio]
default_envs = dual_esp32s3_controller
; Reuse compiled framework objects when switching between carriage profiles.
build_cache_dir = .pio/cache

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Libraries are declared in lib_deps; recursive scanning is unnecessary.
lib_ldf_mode = chain

[web]
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    links2004/WebSockets @ 2.7.2

[esp8266]
platform = espressif8266 @ 4.2.1

[esp32s3]
; Stable PlatformIO Espressif 32 8.0.0 provides Arduino-ESP32 3.3.12.
platform = espressif32 @ 8.0.0
board = carriage-esp32s3-n16r8
upload_protocol = esptool
; Start with a reliable UART speed. Increase only after serial upload succeeds.
upload_speed = 115200

[env:single_nodemcu]
extends = esp8266, web
board = nodemcuv2
build_src_filter = +<single_nodemcu.cpp>

[env:single_d1_mini_pro]
extends = esp8266, web
board = d1_mini_pro
build_src_filter = +<single_d1_mini_pro.cpp>

[env:single_esp32s3]
extends = esp32s3, web
build_src_filter = +<single_esp32s3.cpp>

[env:dual_esp32s3_controller]
extends = esp32s3, web
build_src_filter = +<dual_esp32s3_controller.cpp>
; First USB upload: use a conservative baud rate while checking the COM port.
; After a successful upload, 460800 or 921600 can be tried here.
upload_speed = 115200
; If auto-detection selects the wrong port, verify the board's COM number by
; unplugging/replugging it, then uncomment and change the line below.
; upload_port = COM7

[env:dual_esp32s3_remote]
extends = esp32s3
build_src_filter = +<dual_esp32s3_remote.cpp>

; External Motor-Control AP, two ESP32-S3 carriages, ESP-NOW + OTA.
; Flash the *_home_serial profiles over USB once, then use *_home_ota.
[env:dual_home_main_serial]
extends = esp32s3, web
build_src_filter = +<dual_home_main.cpp>

[env:dual_home_remote_serial]
extends = esp32s3
build_src_filter = +<dual_home_remote.cpp>

[env:dual_home_main_ota]
extends = esp32s3, web
build_src_filter = +<dual_home_main.cpp>
upload_protocol = espota
upload_port = motor.local
upload_flags =
    --port=3232
    --auth=motor8266

[env:dual_home_remote_ota]
extends = esp32s3
build_src_filter = +<dual_home_remote.cpp>
upload_protocol = espota
upload_port = motor-carriage-2.local
upload_flags =
    --port=3232
    --auth=motor8266
